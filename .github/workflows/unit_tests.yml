name: Isolated Duo visual smoke
run-name: Isolated Duo simulator discovery (${{ github.ref_name }})
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: xcode-27
    timeout-minutes: 8
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      CI: 'true'
    steps:
      - name: Discover supported simulator commands
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          xcodebuild -version > "$RUNNER_TEMP/evidence/xcode.txt" 2>&1
          xcrun simctl list -j > "$RUNNER_TEMP/evidence/simulators.json"
          xcrun simctl help > "$RUNNER_TEMP/evidence/simctl-help.txt" 2>&1
          xcrun simctl help io > "$RUNNER_TEMP/evidence/simctl-io-help.txt" 2>&1
          xcrun simctl help ui > "$RUNNER_TEMP/evidence/simctl-ui-help.txt" 2>&1
          python3 - <<'PY'
          import os, pathlib, re, subprocess
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'evidence'
          help=(p/'simctl-help.txt').read_text()
          for line in help.splitlines():
              if re.search(r'fold|display|posture|hinge', line, re.I):
                  m=re.match(r'^\s+([a-z][a-z0-9_-]+)\s+', line)
                  if m:
                      command=m.group(1)
                      result=subprocess.run(['xcrun','simctl','help',command],capture_output=True,text=True)
                      (p/f'simctl-{command}-help.txt').write_text(result.stdout+result.stderr)
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: duo-discovery
          path: ${{ runner.temp }}/evidence
          retention-days: 7
          if-no-files-found: error
